<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1626;--panel:#172238;--ink:#eef2f9;--mute:#9aa8c0;--line:#2a3855;--blue:#6ea0ff;--red:#ff6b78;--gold:#ffc933}}
:root[data-theme="dark"]{--bg:#0e1626;--panel:#172238;--ink:#eef2f9;--mute:#9aa8c0;--line:#2a3855;--blue:#6ea0ff;--red:#ff6b78;--gold:#ffc933}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 Barlow,system-ui,sans-serif}

:root[data-theme="dark"] header,:root:not([data-theme="light"]) header{}

header p{margin:4px 0 14px;opacity:.85}

nav button[aria-selected=true]{opacity:1;border-color:var(--gold)}
nav button:focus-visible{outline:2px solid #fff}
main{max-width:860px;margin:0 auto;padding:16px}
.row{background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--blue);border-radius:4px;margin-bottom:8px}
.row.r1{border-left-color:var(--gold)}
.hd{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:12px 14px;cursor:pointer;width:100%;border:0;background:none;color:inherit;text-align:left;font:inherit}
.rk{font:800 34px "Barlow Condensed",sans-serif;color:var(--mute)}.r1 .rk{color:var(--gold)}
.nm{font:800 24px "Barlow Condensed",sans-serif}
.bar{height:6px;background:var(--line);border-radius:3px;margin-top:4px}.bar i{display:block;height:100%;background:var(--red);border-radius:3px}
.pt{font:800 30px "Barlow Condensed",sans-serif}
.det{padding:0 14px 12px;display:none}.open .det{display:block}
.chip{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-top:1px solid var(--line)}
.chip b{font-weight:600}.mute{color:var(--mute);font-size:14px}
.tag{font-size:12px;padding:1px 6px;border-radius:3px;background:var(--gold);color:#101a2b;margin-left:6px}
table{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line)}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line)}th{font:600 16px "Barlow Condensed",sans-serif;color:var(--mute)}
td.n,th.n{text-align:right}.wrap{overflow-x:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
label{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);padding:8px 12px;border-radius:4px}
input{width:64px;font:inherit;padding:4px;border:1px solid var(--line);border-radius:3px;background:var(--bg);color:var(--ink);text-align:right}
button{font:600 15px Barlow,sans-serif;background:var(--blue);color:#fff;border:0;border-radius:3px;padding:6px 10px;cursor:pointer;margin:6px 6px 0 0}button:disabled{opacity:.4;cursor:default}nav button{background:transparent}
h2{font:800 26px "Barlow Condensed",sans-serif;margin:8px 0 12px}

 return p+(D.rb[t.rank]||0)}
let picks=[],db=null,armed=0,cfg=null;

function clock(i){const a=L().owners,N=a.length,r=Math.floor(i/N),k=i%N;return a[r%2?N-1-k:k].id}

  D.teams.slice().sort((a,b)=>pts(b)-pts(a)).map(t=>`<tr><td><b>${t.n}</b> ${e(t.name)}</td><td class="n">${t.rank}</td><td class="n">${t.qw}</td><td class="n">${t.rp}</td><td class="n">${t.pw}</td><td class="n"><b>${pts(t)}</b></td></tr>`).join('')+'</table></div>'}

function doImport(buf){try{const wb=XLSX.read(buf,{type:'array'}),g=n=>XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,defval:null});
 const ts=g('Team Stats'),hi=ts.findIndex(r=>r[0]=='Team #'),teams=[];
 ts.slice(hi+1).forEach(r=>{if(typeof r[0]=='number')teams.push({n:r[0],name:r[1],qw:r[2]||0,qt:r[3]||0,rp:r[4]||0,rank:r[5],al:r[6],pw:r[7]||0,champ:r[8]=='Y',award:r[9],pts:r[10]})});
 if(hi<0||!teams.length){msg='Could not find team rows on the Team Stats sheet.';view();return}
 const sk={},rb={};g('Scoring Key').forEach(r=>{if(typeof r[0]=='number'&&typeof r[1]=='number')rb[r[0]]=r[1];else if(r[0]&&typeof r[1]=='number')sk[r[0]]=r[1]});
 const dr=g('Draft & Roster'),oi=dr.findIndex(r=>r[0]=='Owner'),owners=[],epa={};
 for(const r of dr.slice(oi+1)){if(!r[0]||r[1]==null)break;owners.push({o:String(r[0]),t:r.slice(1,7).filter(x=>typeof x=='number')})}
 dr.slice(oi+1).forEach(r=>{if(typeof r[10]=='number'&&typeof r[12]=='number')epa[r[10]]=Math.round(r[12]*10)/10;if(typeof r[16]=='number'&&typeof r[18]=='number')epa[r[16]]=Math.round(r[18]*10)/10});
 if(!owners.length){msg='Could not find owners on the Draft & Roster sheet.';view();return}
 db.doc('event/data').set({teams,sk:Object.entries(sk),rb,owners,epa,event:String((ts[0]||[])[1]||'')});
 picks.forEach(p=>db.doc('picks/'+pad(p.i)).delete().catch(()=>{}));db.doc('config/league').delete().catch(()=>{});
 msg='Imported '+teams.length+' teams from '+((ts[0]||[])[1]||'the workbook')+'.';view()}catch(err){msg='That file could not be read as the league workbook.';view()}}

function norm(d){d.sk=Object.fromEntries(Object.values(d.sk));d.owners=Object.values(d.owners).map(o=>({o:o.o,t:Object.values(o.t||[])}));d.teams=Object.values(d.teams);return d}
const shim=r=>({doc:p=>({set:d=>r.child(p).set(d),delete:()=>r.child(p).remove(),onSnapshot:f=>r.child(p).on('value',s=>f({exists:s.exists(),data:()=>s.val()}),fail)}),
 collection:p=>({onSnapshot:f=>r.child(p).on('value',s=>{const docs=[];s.forEach(c=>{const v=c.val();docs.push({data:()=>v})});f({docs})},fail)})});
function join(code){code=String(code).trim().toLowerCase().replace(/[.#$\[\]\/\s]/g,'-');if(!code)return;
 try{localStorage.setItem('ffrc-code',code)}catch(e){}
 try{firebase.initializeApp(FB);const d=shim(firebase.database().ref('leagues/'+code));db=d;document.getElementById('gate').style.display='none';document.getElementById('sw').textContent='League: '+code+' (switch)';d.doc('event/data').onSnapshot(s=>{setD(s.exists?norm(s.data()):BASE);if(tab!='k')view()},()=>{});d.doc('config/league').onSnapshot(s=>{cfg=s.exists?s.data():null;if(tab!='k')view()},()=>{});d.collection('picks').onSnapshot(s=>{picks=s.docs.map(x=>x.data()).sort((a,b)=>a.i-b.i);armed=0;if(tab!='k')view()},()=>{})}catch(e){fail()}}
